  <div class="content">
    <section class="pane" data-pane="intro">
      <p class="eyebrow">AI · Data · UX Engineer · Glasgow</p>
      <h1>I build LLM systems<br>that survive contact<br>with real use.</h1>
      <p class="lede">Not demos. A LangGraph agent with human-in-the-loop safety controls. An eval pipeline that catches regressions <em>before</em> they ship. A hybrid-search RAG pipeline that ships with its own evaluation suite.</p>
      <p>The through-line is that I don't trust a system I can't measure. Most "AI agent" projects are a loop around a chat completion and a hope. Mine treat the model as an untrusted input source — the harness decides what's safe, records what happened, and a human holds the switch on anything expensive.</p>

      <div class="quote">
        <p>I came to AI engineering from data analysis and UI/UX design. That means I'm comfortable across the data, the model <em>and</em> the interface — not just one layer of the stack.</p>
      </div>

      <div class="stats">
        <div class="stat"><b>6</b><span>Shipped AI systems</span></div>
        <div class="stat"><b>MSc</b><span>Adv. Computer Science</span></div>
        <div class="stat"><b>3</b><span>Layers of the stack</span></div>
      </div>

      <div class="btn-row">
        <button class="btn primary" data-open="projects">See the work</button>
        <button class="btn" data-open="contact">Get in touch</button>
      </div>
    </section>

    <section class="pane" data-pane="path" hidden>
      <p class="eyebrow">Background</p>
      <h1>The path here</h1>
      <p class="lede">Three disciplines, in the order I picked them up — each one still doing work in how I build.</p>

      <ol class="path">
        <li>
          <h3>Data analysis</h3>
          <p>SQL, Pandas, scikit-learn, R, and the dashboards that carry the result — Tableau, Power BI, Streamlit. This is where I learned that a number nobody can interrogate is a number nobody should trust. It's the same instinct behind writing an eval pipeline before claiming a model improved.</p>
        </li>
        <li>
          <h3>UI/UX design</h3>
          <p>Figma, React, Three.js, WebGL. Design taught me that the interface <em>is</em> where the product actually happens. A retrieval system nobody can steer is a research demo — so I build the front end with the same care as the pipeline behind it.</p>
        </li>
        <li>
          <h3>AI engineering</h3>
          <p>LangGraph, the Claude API, RAG, LLM-as-judge evaluation, agent regression testing and Ollama. Currently deepening this through a structured AI engineering course, with retrieval, agents and evals as the core focus — on top of an MSc in Advanced Computer Science with AI from Strathclyde.</p>
        </li>
      </ol>

      <p>Most people in this field arrive from one direction. Arriving from three is why I tend to notice when the model is fine and the <em>retrieval</em> is broken, or when the pipeline is correct and the interface is the thing failing the user.</p>
    </section>

    <section class="pane" data-pane="how" hidden>
      <p class="eyebrow">Principles</p>
      <h1>How I work</h1>
      <p class="lede">Four things I believe strongly enough that they show up in every repository I own.</p>

      <h2>Measure it or don't claim it</h2>
      <p>Every AI system I build ships with an evaluation harness — a rubric, persisted runs, and a dashboard that catches regressions. Agent Evals exists because "it feels better now" is not a metric, and because version 2 breaking something version 1 handled is the failure nobody notices until a user does.</p>

      <h2>Retrieval beats a bigger prompt</h2>
      <p>Hybrid vector and keyword search, proper reranking, deterministic chunk IDs. Most "the model is wrong" problems are retrieval problems wearing a costume. And when retrieval genuinely can't answer, the honest move is to refuse — RAGStar says so rather than inventing something, and makes no model call at all.</p>

      <h2>The model is untrusted input</h2>
      <p>It can request an action; my code decides whether to run it. Consequential actions stop and wait for a human, prompt injection gets screened and logged, and everything lands in an append-only audit trail you can replay months later.</p>

      <h2>Local first, where it's possible</h2>
      <p>RAGStar and Zetsu both run entirely on your own machine — no API keys, no accounts, nothing uploaded. Partly cost, mostly privacy: the people who most need to ask questions of their own documents are often the least able to send them somewhere else.</p>
    </section>

    <section class="pane" data-pane="stack" hidden>
      <p class="eyebrow">Toolkit</p>
      <h1>Things I reach for</h1>
