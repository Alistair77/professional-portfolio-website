      <p class="eyebrow">AI · Data · UX Engineer</p>
      <h1>I build AI that ships.</h1>
      <p class="lede">Retrieval systems, agent pipelines, on-device models — and the interfaces that make them usable. The model is only half the product; the other half is whether anyone can actually drive it.</p>
      <p>MSc Advanced Computer Science at <strong>Strathclyde</strong>. I work across the whole path: the retrieval layer, the evaluation harness that proves it works, and the front end people actually touch.</p>
      <div class="stats">
        <div class="stat"><b>6</b><span>Shipped projects</span></div>
        <div class="stat"><b>MSc</b><span>Adv. Computer Science</span></div>
        <div class="stat"><b>AI + Web</b><span>Both ends of the stack</span></div>

      <div class="btn-row">

        <button class="btn" data-open="contact">Get in touch</button>
      </div>
    </section>

    <section class="pane" data-pane="how" hidden>
      <p class="eyebrow">Approach</p>
      <h1>How I work</h1>
      <h2>Measure before you claim</h2>
      <p>Every AI system I build ships with an evaluation harness. A rubric, persisted runs, and a dashboard that catches regressions — otherwise "it got better" is just a feeling.</p>
      <h2>Retrieval beats a bigger prompt</h2>
      <p>Hybrid search, proper reranking, deterministic chunk IDs. Most "the model is wrong" problems are retrieval problems wearing a costume.</p>
      <h2>Keep a human in the loop</h2>
      <p>Agents should pause before high-impact actions. Resumable state and step-level tracing mean you can replay exactly what happened instead of guessing.</p>
      <h2>The interface is the product</h2>
      <p>A retrieval system nobody can steer is a research demo. I build the front end with the same care as the pipeline behind it.</p>
    </section>

    <section class="pane" data-pane="stack" hidden>

    <section class="pane" data-pane="now" hidden>
