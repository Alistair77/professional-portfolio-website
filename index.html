      <p>Every AI system I build ships with an evaluation harness. A rubric, persisted runs, and a dashboard that catches regressions — otherwise "it got better" is just a feeling.</p>
      <h2>Retrieval beats a bigger prompt</h2>

    <section class="pane" data-pane="ragstar" hidden>
      <p class="eyebrow">2026 · AI Engineering</p>
      <h1>RAGStar</h1>
      <p class="lede">A hybrid retrieval pipeline that answers from your documents and cites them — running a local model, so nothing leaves the machine.</p>
      <h2>Retrieval</h2>
      <p>Pinecone vector search and BM25 keyword search run side by side, merged with <strong>Reciprocal Rank Fusion</strong> at a k=60 smoothing constant. Dense search alone misses exact terms; sparse alone misses meaning. Fusing them covers both.</p>
      <h2>Precision</h2>
      <p>A Cohere cross-encoder reranks the top 20 candidates before anything reaches the model, so the context window carries signal rather than volume. Generation runs on a local <strong>Ollama</strong> model — private, and grounded in citations.</p>
      <h2>Engineering</h2>
      <p>FastAPI service with Pydantic validation at the boundary. Chunk IDs are deterministic MD5 hashes, so re-ingesting a document updates it instead of silently duplicating it. Covered by unit tests.</p>
      <div class="tags"><span class="tag">Python</span><span class="tag">FastAPI</span><span class="tag">Pinecone</span><span class="tag">BM25</span><span class="tag">Cohere</span><span class="tag">Ollama</span><span class="tag">Pydantic</span></div>
      <div class="btn-row"><a class="btn primary" href="https://github.com/Alistair77/ragstar" target="_blank" rel="noopener">View repository</a></div>
    </section>

    <section class="pane" data-pane="orchestrator" hidden>
      <p class="eyebrow">2026 · AI Engineering</p>
      <h1>Agent Orchestrator</h1>
      <p class="lede">A multi-step agent that decomposes a task, runs tools, and critiques its own work before deciding what to do next.</p>
      <h2>The loop</h2>
      <p><strong>Plan → Act → Reflect.</strong> The agent breaks the task down, executes, then self-critiques each step before choosing the next move — so a bad step gets caught at the step, not at the end of the run.</p>
      <h2>Human in the loop</h2>
      <p>Built on LangGraph over Claude, with checkpoints that pause and wait for approval before high-impact actions. Autonomy where it's cheap, a human where it isn't.</p>
      <h2>Debuggability</h2>
      <p>Run state is structured and resumable, with step-level tracing. You can replay a run deterministically instead of reconstructing what the agent was thinking.</p>
      <div class="tags"><span class="tag">Python</span><span class="tag">LangGraph</span><span class="tag">Claude</span><span class="tag">Tool use</span><span class="tag">Tracing</span></div>
      <div class="btn-row"><a class="btn primary" href="https://github.com/Alistair77/agent-orchestrator" target="_blank" rel="noopener">View repository</a></div>
    </section>

    <section class="pane" data-pane="evals" hidden>
      <p class="eyebrow">2026 · AI Engineering</p>
      <h1>Agent Evals</h1>
      <p class="lede">An evaluation pipeline for LLM output — because "it seems better now" is not a metric.</p>
      <h2>Scoring</h2>
      <p>Synthetic eval datasets generated per task, scored with a <strong>Claude-as-judge</strong> rubric so grading stays consistent and — more usefully — explainable. A failed case tells you why it failed.</p>
      <h2>Storage</h2>
      <p>Every run and metric lands in DuckDB, which makes slicing across prompts, models and versions fast enough to actually do it.</p>
      <h2>Inspection</h2>
      <p>A Streamlit dashboard to read failures, compare runs side by side, and catch quality regressions before they ship.</p>
      <div class="tags"><span class="tag">Python</span><span class="tag">Claude-as-judge</span><span class="tag">DuckDB</span><span class="tag">Streamlit</span><span class="tag">Evals</span></div>
      <div class="btn-row"><a class="btn primary" href="https://github.com/Alistair77/agent-evals" target="_blank" rel="noopener">View repository</a></div>

    <section class="pane" data-pane="hawkai" hidden>
      <p class="eyebrow">2026 · Frontend Engineering</p>
      <h1>HawkAI</h1>
      <p class="lede">A 3D authentication screen — a login page that earns the attention it takes.</p>
      <h2>The scene</h2>
      <p>A Draco-compressed GLB security camera model in Three.js, tracking the cursor in real time with genuine depth response rather than a flat parallax trick.</p>
      <h2>Shaders and atmosphere</h2>
      <p>Custom <strong>GLSL</strong> shaders drive animated data-flow ribbons, with a particle system of 600+ floating dust points for depth. Cinematic without tipping into noise.</p>
      <h2>Composition</h2>
      <p>The WebGL layer renders transparent and composites under an Ant Design form, so the 3D is atmosphere and the form stays a real, accessible form. Rendering adapts to the viewport rather than shipping one heavy scene to every device.</p>
